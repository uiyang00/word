<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词汇量测评</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #4A90D9;
  --blue-dark: #3A7BC8;
  --green: #52C41A;
  --red: #E74C3C;
  --orange: #F39C12;
  --bg: #F7F8FA;
  --card: #FFFFFF;
  --text: #2C3E50;
  --text-light: #7F8C8D;
  --border: #E8ECF1;
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --radius: 14px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  -webkit-tap-highlight-color: transparent;
}

.container {
  width: 100%;
  max-width: 480px;
  position: relative;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 36px 28px;
  text-align: center;
}

/* ===== Welcome Page ===== */
.welcome .icon {
  font-size: 56px;
  margin-bottom: 16px;
}

.welcome h1 {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.welcome .subtitle {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 28px;
  line-height: 1.6;
}

.welcome .rules {
  text-align: left;
  background: #F0F5FF;
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 28px;
  font-size: 13px;
  line-height: 1.8;
  color: #555;
}

.welcome .rules span {
  font-weight: 600;
  color: var(--blue-dark);
}

/* ===== Buttons ===== */
.btn {
  display: inline-block;
  padding: 14px 48px;
  font-size: 17px;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  letter-spacing: 0.5px;
}

.btn-primary {
  background: var(--blue);
  color: #fff;
}

.btn-primary:hover { background: var(--blue-dark); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

.btn-outline {
  background: #fff;
  color: var(--blue);
  border: 2px solid var(--blue);
}

.btn-outline:hover { background: #F0F5FF; }

/* ===== Progress Bar ===== */
.progress-wrap {
  margin-bottom: 24px;
}

.level-tag {
  display: inline-block;
  background: #EEF2FF;
  color: var(--blue-dark);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 3px;
  transition: width 0.4s ease;
}

/* ===== Test Page ===== */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text-light);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.stat-dot.green { background: var(--green); }
.stat-dot.red { background: var(--red); }

.word-display {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text);
  margin: 28px 0 24px;
  word-break: break-all;
}

.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

.input-group input {
  flex: 1;
  padding: 13px 16px;
  font-size: 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
}

.input-group input:focus {
  border-color: var(--blue);
}

.input-group .btn {
  padding: 13px 24px;
  white-space: nowrap;
}

/* ===== Feedback ===== */
.feedback {
  min-height: 36px;
  line-height: 36px;
  font-size: 14px;
  font-weight: 600;
  transition: opacity 0.2s;
}

.feedback.correct { color: var(--green); }
.feedback.wrong { color: var(--red); }
.feedback .correct-word { font-weight: 400; font-size: 13px; color: var(--text-light); display: block; line-height: 1.5; }

/* ===== Level Up Toast ===== */
.level-up-toast {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #fff;
  padding: 12px 28px;
  border-radius: 24px;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 4px 20px rgba(82,196,26,0.35);
  z-index: 100;
  animation: toastIn 0.4s ease, toastOut 0.3s 1.5s ease forwards;
  pointer-events: none;
}

@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-16px); } }

/* ===== Result Page ===== */
.result .icon { font-size: 48px; margin-bottom: 12px; }

.result .vocab-count {
  font-size: 56px;
  font-weight: 800;
  color: var(--blue-dark);
  line-height: 1.1;
}

.result .vocab-label {
  font-size: 14px;
  color: var(--text-light);
  margin: 4px 0 20px;
}

.result .level-badge {
  display: inline-block;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  padding: 10px 32px;
  border-radius: 26px;
  margin-bottom: 24px;
  letter-spacing: 1px;
}

.result .detail-list {
  text-align: left;
  background: #FAFBFC;
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 24px;
  font-size: 13px;
  line-height: 2;
  color: #666;
}

.result .detail-list strong { color: var(--text); }

/* ===== Hidden ===== */
.hidden { display: none !important; }

/* ===== Mobile ===== */
@media (max-width: 480px) {
  .card { padding: 28px 18px; }
  .word-display { font-size: 30px; margin: 22px 0 18px; }
  .welcome h1 { font-size: 22px; }
  .result .vocab-count { font-size: 44px; }
  .input-group { flex-direction: column; }
  .input-group .btn { width: 100%; }
}
</style>
</head>
<body>
<div class="container">

  <!-- ==================== 欢迎页 ==================== -->
  <div id="page-welcome" class="card welcome">
    <div class="icon">📖</div>
    <h1>词汇量测评</h1>
    <p class="subtitle">抽样估算你的英语词汇量<br>全程不存储任何数据 · 每次都是全新测评</p>
    <div class="rules">
      📋 <span>测评规则</span><br>
      1. 从小学级别开始，显示英文单词，输入中文释义<br>
      2. 当前级别连续答对 <span>3</span> 题 → 自动晋升更高难度<br>
      3. 全局累计答错 <span>4</span> 题 → 立即终止，生成测评结果<br>
      4. 每个级别共 <span>8</span> 个难度档位：小学 ～ 雅思
    </div>
    <button class="btn btn-primary" onclick="startTest()">开始测评</button>
  </div>

  <!-- ==================== 测试页 ==================== -->
  <div id="page-test" class="card hidden">
    <!-- 进度条 -->
    <div class="progress-wrap">
      <div class="level-tag" id="level-tag">小学</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- 统计 -->
    <div class="stats-row">
      <div class="stat-item"><span class="stat-dot green"></span> 正确 <strong id="correct-count">0</strong></div>
      <div class="stat-item"><span class="stat-dot red"></span> 错误 <strong id="wrong-count">0</strong>/4</div>
    </div>

    <!-- 单词 -->
    <div class="word-display" id="word-display">—</div>

    <!-- 输入 -->
    <div class="input-group">
      <input type="text" id="answer-input" placeholder="输入中文释义…" autocomplete="off" autofocus>
      <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()">确认</button>
    </div>

    <!-- 反馈 -->
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- ==================== 结果页 ==================== -->
  <div id="page-result" class="card result hidden">
    <div class="icon">🎉</div>
    <div class="vocab-count" id="vocab-number">0</div>
    <div class="vocab-label">估算词汇量</div>
    <div class="level-badge" id="level-badge">—</div>
    <div class="detail-list" id="detail-list"></div>
    <button class="btn btn-primary" onclick="restartTest()">重新测评</button>
  </div>

</div>

    { en: "esoteric", zh: ["深奥","秘传","难懂","小众"] },
    { en: "fastidious", zh: ["挑剔","苛求","讲究","一丝不苟"] },
    { en: "grandiose", zh: ["宏伟","浮夸","自命不凡","华而不实"] },
    { en: "hubris", zh: ["傲慢","自大","狂妄","骄傲"] },
    { en: "idiosyncratic", zh: ["独特","特质","个人特有","癖好"] },
    { en: "juxtaposition", zh: ["并列","并置","对比","相提并论"] },
    { en: "kaleidoscopic", zh: ["千变万化","万花筒式","变化多端"] },
    { en: "loquacious", zh: ["话多","饶舌","健谈","喋喋不休"] },
    { en: "meticulous", zh: ["细致","一丝不苟","精心","缜密"] },
    { en: "nonchalant", zh: ["漠不关心","冷淡","若无其事","漫不经心"] },
    { en: "ostentatious", zh: ["炫耀","卖弄","铺张","摆阔"] },
    { en: "paradigm", zh: ["范例","范式","模式","典范"] },
    { en: "pragmatic", zh: ["务实","实用","实事求是","注重实效"] },
    { en: "quagmire", zh: ["沼泽","困境","泥潭","窘境"] },
    { en: "surreptitious", zh: ["偷偷摸摸","鬼鬼祟祟","暗中","秘密"] },
    { en: "ubiquitous", zh: ["无所不在","普遍存在","随处可见"] }
  ]
};

// ===========================
// 级别配置
// ===========================

const LEVELS = [
  { id: "primary", name: "小学",  baseVocab: 1000,  color: "#52C41A" },
  { id: "junior",  name: "初中",  baseVocab: 2000,  color: "#73D13D" },
  { id: "senior",  name: "高中",  baseVocab: 3500,  color: "#F39C12" },
  { id: "cet4",    name: "四级",  baseVocab: 4500,  color: "#E67E22" },
  { id: "cet6",    name: "六级",  baseVocab: 6000,  color: "#E74C3C" },
  { id: "tem4",    name: "专四",  baseVocab: 8000,  color: "#9B59B6" },
  { id: "tem8",    name: "专八",  baseVocab: 13000, color: "#8E44AD" },
  { id: "ielts",   name: "雅思",  baseVocab: 15000, color: "#2C3E50" }
];

const CONSECUTIVE_TO_ADVANCE = 3;   // 连续答对 N 题晋升
const MAX_WRONG = 4;                // 累计错 N 题终止

// ===========================
// 状态（全内存，刷新清零）
// ===========================

let currentLevelIndex = 0;
let consecutiveCorrect = 0;
let totalWrong = 0;
let totalCorrect = 0;
let currentWord = null;
let usedWords = null;        // Set — 当前级别已使用的单词索引
let levelCorrectCount = 0;   // 当前级别答对数（用于结果估算）
let isWaiting = false;       // 反馈等待中，禁止重复提交
let bestLevelIndex = 0;      // 用户达到的最高级别下标

// ===========================
// DOM 引用
// ===========================

const $welcome  = document.getElementById("page-welcome");
const $test     = document.getElementById("page-test");
const $result   = document.getElementById("page-result");

const $levelTag      = document.getElementById("level-tag");
const $progressFill  = document.getElementById("progress-fill");
const $correctCount  = document.getElementById("correct-count");
const $wrongCount    = document.getElementById("wrong-count");
const $wordDisplay   = document.getElementById("word-display");
const $answerInput   = document.getElementById("answer-input");
const $submitBtn     = document.getElementById("submit-btn");
const $feedback      = document.getElementById("feedback");

const $vocabNumber   = document.getElementById("vocab-number");
const $levelBadge    = document.getElementById("level-badge");
const $detailList    = document.getElementById("detail-list");

// ===========================
// 页面切换
// ===========================

function showPage(page) {
  $welcome.classList.add("hidden");
  $test.classList.add("hidden");
  $result.classList.add("hidden");
  page.classList.remove("hidden");
}

// ===========================
// 开始测试
// ===========================

function startTest() {
  // 重置所有状态
  currentLevelIndex = 0;
  consecutiveCorrect = 0;
  totalWrong = 0;
  totalCorrect = 0;
  currentWord = null;
  usedWords = new Set();
  levelCorrectCount = 0;
  isWaiting = false;
  bestLevelIndex = 0;

  showPage($test);
  updateStats();
  updateLevelUI();
  nextWord();
  $answerInput.focus();
}

// ===========================
// 重新测试
// ===========================

function restartTest() {
  startTest();
}

// ===========================
// 更新统计显示
// ===========================

function updateStats() {
  $correctCount.textContent = totalCorrect;
  $wrongCount.textContent = totalWrong;
}

// ===========================
// 更新级别 UI
// ===========================

function updateLevelUI() {
  const level = LEVELS[currentLevelIndex];
  $levelTag.textContent = level.name;
  $levelTag.style.background = level.color + "22";
  $levelTag.style.color = level.color;
  // 进度条显示级别进度
  const pct = (currentLevelIndex / (LEVELS.length - 1)) * 100;
  $progressFill.style.width = pct + "%";
  $progressFill.style.background = level.color;
}

// ===========================
// 抽取下一题
// ===========================

function nextWord() {
  const bank = WORD_BANKS[LEVELS[currentLevelIndex].id];

  // 如果当前级别单词全部用完，重置
  if (usedWords.size >= bank.length) {
    usedWords.clear();
  }

  // 随机选一个未用过的
  let idx;
  do {
    idx = Math.floor(Math.random() * bank.length);
  } while (usedWords.has(idx) && usedWords.size < bank.length);

  usedWords.add(idx);
  currentWord = bank[idx];
  $wordDisplay.textContent = currentWord.en;
  $answerInput.value = "";
  $feedback.textContent = "";
  $feedback.className = "feedback";
  $answerInput.focus();
}

// ===========================
// 提交答案
// ===========================

function submitAnswer() {
  if (isWaiting) return; // 反馈等待中
  if (!currentWord) return;

  const userInput = $answerInput.value.trim();
  if (!userInput) {
    $answerInput.focus();
    return;
  }

  // 比对：用户输入是否包含在可接受的中文释义中，或可接受释义包含用户输入
  const acceptable = currentWord.zh;
  const isCorrect = acceptable.some(ans =>
    ans === userInput || userInput.includes(ans) || ans.includes(userInput)
  );

  if (isCorrect) {
    // ---- 正确 ----
    totalCorrect++;
    consecutiveCorrect++;
    levelCorrectCount++;
    $feedback.textContent = "✅ 正确！";
    $feedback.className = "feedback correct";

    if (bestLevelIndex < currentLevelIndex) {
      bestLevelIndex = currentLevelIndex;
    }

    updateStats();

    // 判断是否晋升
    if (consecutiveCorrect >= CONSECUTIVE_TO_ADVANCE) {
      if (currentLevelIndex >= LEVELS.length - 1) {
        // 已经是最高级别（雅思），连续答对3题 → 结束
        isWaiting = true;
        setTimeout(() => {
          isWaiting = false;
          endTest();
        }, 800);
        return;
      }
      // 晋升
      consecutiveCorrect = 0;
      levelCorrectCount = 0;
      currentLevelIndex++;
      usedWords = new Set();
      updateLevelUI();
      showLevelUpToast(LEVELS[currentLevelIndex].name);
      isWaiting = true;
      setTimeout(() => {
        isWaiting = false;
        nextWord();
      }, 1200);
    } else {
      isWaiting = true;
      setTimeout(() => {
        isWaiting = false;
        nextWord();
      }, 600);
    }
  } else {
    // ---- 错误 ----
    totalWrong++;
    consecutiveCorrect = 0;  // 连续正确中断
    const correctAns = currentWord.zh.join(" / ");
    $feedback.innerHTML = `❌ 错误！<span class="correct-word">正确答案：${correctAns}</span>`;
    $feedback.className = "feedback wrong";

    if (bestLevelIndex < currentLevelIndex) {
      bestLevelIndex = currentLevelIndex;
    }

    updateStats();

    // 判断是否达到错误上限
    if (totalWrong >= MAX_WRONG) {
      isWaiting = true;
      setTimeout(() => {
        isWaiting = false;
        endTest();
      }, 1000);
      return;
    }

    isWaiting = true;
    setTimeout(() => {
      isWaiting = false;
      nextWord();
    }, 1200);
  }
}

// ===========================
// 级别晋升 Toast
// ===========================

function showLevelUpToast(levelName) {
  const toast = document.createElement("div");
  toast.className = "level-up-toast";
  toast.textContent = "🎉 晋升至：" + levelName;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// ===========================
// 结束测试 → 结果页
// ===========================

function endTest() {
  showPage($result);

  // 估算词汇量
  const vocab = estimateVocab();
  const levelName = getVocabLevelName(vocab);

  // 动画计数
  animateCount($vocabNumber, 0, vocab, 800);

  $levelBadge.textContent = levelName;

  // 详细摘要
  const reachedLevel = LEVELS[Math.max(bestLevelIndex, 0)];
  const terminatedLevel = LEVELS[Math.min(currentLevelIndex, LEVELS.length - 1)];

  $detailList.innerHTML = `
    答对 <strong>${totalCorrect}</strong> 题 &nbsp;·&nbsp; 答错 <strong>${totalWrong}</strong> 题<br>
    达到最高级别：<strong>${reachedLevel.name}</strong>（${reachedLevel.baseVocab.toLocaleString()} 词）<br>
    终止时级别：<strong>${terminatedLevel.name}</strong><br>
    <span style="color:#999;font-size:12px;">* 本测评为抽样估算，结果仅供参考</span>
  `;
}

// ===========================
// 词汇量估算算法
// ===========================

function estimateVocab() {
  // 用户在 bestLevelIndex 级别展现了一定能力
  const level = LEVELS[Math.max(bestLevelIndex, 0)];

  // 基础词汇量 = 该级别的基准词汇量
  let base = level.baseVocab;

  // 根据该级别的答对情况微调
  // 如果用户在该级别答对越多，向更高级别靠拢
  const ratio = Math.min(levelCorrectCount / CONSECUTIVE_TO_ADVANCE, 1);

  if (bestLevelIndex < LEVELS.length - 1) {
    const nextBase = LEVELS[bestLevelIndex + 1].baseVocab;
    // 在当前级别和下一级别之间插值
    base = Math.round(level.baseVocab + (nextBase - level.baseVocab) * ratio * 0.8);
  } else {
    // 最高级别，按比例超出基准
    base = Math.round(level.baseVocab * (1 + ratio * 0.15));
  }

  // 总正确数微调（+ 少量加成）
  base += totalCorrect * 30;

  return base;
}

function getVocabLevelName(vocab) {
  if (vocab < 1500)  return "小学水平";
  if (vocab < 2800)  return "初中水平";
  if (vocab < 4000)  return "高中水平";
  if (vocab < 5200)  return "大学四级水平";
  if (vocab < 7000)  return "大学六级水平";
  if (vocab < 10000) return "英语专四水平";
  if (vocab < 14000) return "英语专八水平";
  return "雅思/留学水平";
}

// ===========================
// 数字动画
// ===========================

function animateCount(el, from, to, duration) {
  const start = performance.now();
  function tick(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    // ease-out
    const val = Math.round(from + (to - from) * (1 - Math.pow(1 - progress, 3)));
    el.textContent = val.toLocaleString();
    if (progress < 1) {
      requestAnimationFrame(tick);
    }
  }
  requestAnimationFrame(tick);
}

// ===========================
// 键盘事件：回车提交
// ===========================

$answerInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    submitAnswer();
  }
});

// ===========================
// 初始化：显示欢迎页
// ===========================

showPage($welcome);
</script>
</body>
</html>
